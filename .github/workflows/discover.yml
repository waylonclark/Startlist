name: Discover races

on:
  schedule:
    - cron: '0 11 * * 1'      # Mondays, 11:00 UTC
  workflow_dispatch:
    inputs:
      months:
        description: 'Months ahead to search'
        default: '18'
      dry:
        description: 'Dry run (no commit)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # A full crawl runs 15-20 minutes. Anything past 45 means something is
    # wedged — fail loudly rather than burning an hour of runner time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # v5 and Node 22: the v4 actions run on Node 20, which the runners now force
      # onto Node 24 with a deprecation warning.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # STARTLIST_CONTACT identifies the crawler to Nominatim. Set it as a repo
      # variable (Settings → Secrets and variables → Actions → Variables), not a
      # secret — it is sent in every request header and is meant to be public.
      # Falls back to this repo's URL, which satisfies the policy on its own.
      - name: Crawl and merge
        # pipefail matters: without it the exit code comes from `tee`, so a crash
        # in the pipeline would report a green step and open an empty PR.
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STARTLIST_CONTACT: ${{ vars.STARTLIST_CONTACT || format('https://github.com/{0}', github.repository) }}
        run: |
          set -euo pipefail
          node pipeline/run.js \
            --months "${{ inputs.months || '18' }}" \
            ${{ inputs.dry == true && '--dry' || '' }} \
            | tee run.log

      # No diff means nothing was discovered or changed. Opening a PR anyway
      # trains you to ignore them.
      - name: Check for changes
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- events.js pipeline/data/events.json; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No event changes — skipping PR."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # New and changed events land in a PR rather than straight on main, so you
      # eyeball them before they are published. Remove this step and commit
      # directly if you would rather it be fully unattended.
      - name: Open a review PR
        id: pr
        if: ${{ inputs.dry != true && steps.changed.outputs.any == 'true' }}
        # The branch is pushed before the PR is created. If the org/repo forbids
        # Actions from opening PRs, don't throw the crawl away — keep the branch
        # and print the compare link so the PR can be opened by hand.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: crawl/${{ github.run_number }}
          commit-message: 'Crawl: refresh event index'
          title: 'Crawl ${{ github.run_number }} — event index update'
          body-path: run.log
          add-paths: |
            events.js
            pipeline/data/events.json
            pipeline/reports/
          delete-branch: true

      - name: Report PR outcome
        if: ${{ inputs.dry != true && steps.changed.outputs.any == 'true' }}
        shell: bash
        env:
          BRANCH: crawl/${{ github.run_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ] && [ -n "$PR_URL" ]; then
            echo "### Review PR opened" >> "$GITHUB_STEP_SUMMARY"
            echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Crawl succeeded — PR not opened"
              echo
              echo "Changes are committed and pushed to branch \`$BRANCH\`."
              echo "GitHub blocked the PR creation, most likely because"
              echo "**Settings → Actions → General → Workflow permissions →"
              echo "Allow GitHub Actions to create and approve pull requests** is off."
              echo
              echo "Open it manually: $REPO_URL/compare/main...$BRANCH"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PR creation blocked — branch $BRANCH is pushed and ready."
          fi
